<style>
:root{
  --ink:#241f19; --stone:#eae4d8; --paper:#f6f2e9; --line:#d8cfbb;
  --saddle:#a6592e; --muted:#7a7266; --white:#fffdf9;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--stone);color:var(--ink);line-height:1.6;}
h1,h2,.serif{font-family:'Newsreader',serif;}
a{color:inherit;text-decoration:none;}
.site-header{background:var(--white);border-bottom:1px solid var(--line);}
.site-header-inner{max-width:1040px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.site-brand{display:flex;align-items:center;gap:10px;font-family:'Newsreader',serif;font-weight:600;font-size:19px;}
.site-brand img{width:34px;height:34px;object-fit:contain;}
.site-nav{display:flex;align-items:center;gap:22px;font-size:14.5px;}
.site-nav a{color:var(--muted);}
.site-nav a:hover{color:var(--ink);}
.site-nav a.active{color:var(--ink);font-weight:600;}
.site-nav a.cta{background:var(--ink);color:var(--white);padding:9px 18px;border-radius:3px;font-weight:600;}
.site-nav a.cta:hover{background:var(--saddle);color:var(--white);}
.page{max-width:720px;margin:0 auto;padding:80px 24px 110px;}
.page h1{font-size:32px;font-weight:600;margin-bottom:18px;}
.page .placeholder{background:var(--white);border:1px dashed var(--line);border-radius:4px;padding:40px 24px;color:var(--muted);font-size:14px;text-align:center;}
.site-footer{border-top:1px solid var(--line);padding:22px 24px;text-align:center;font-size:12.5px;color:var(--muted);}
@media (max-width:600px){
  .site-header-inner{flex-direction:column;align-items:flex-start;}
  .site-nav{gap:16px;flex-wrap:wrap;}
  .page{padding:60px 20px 80px;}
}
</style>
</head>
